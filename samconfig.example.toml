version = 0.1

[default.deploy.parameters]
stack_name = "campusflow"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
# GroqApiKey is NoEcho and must not be committed. Pass it on the command line:
#   sam deploy --parameter-overrides GroqApiKey="gsk_..."
parameter_overrides = "FrontendOrigin=\"https://your-branch.example.amplifyapp.com\" AIProvider=\"groq\" GroqExtractionModel=\"openai/gpt-oss-20b\" GroqReasoningModel=\"openai/gpt-oss-120b\" DailyStudyHours=4"
